---
- name: Install Docker
  become: true
  apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present


- name: Gathering user
  set_fact:
    user: "{{ ansible_facts.env.SUDO_USER | default(ansible_facts.env.USER) }}"


- name: Add user to docker group
  become: true
  user:
    name: "{{ user }}"
    groups: docker
    append: true


- name: Enable Docker service
  systemd:
    name: docker
    enabled: true
    state: started

---
- name: Install VSCodium
  import_tasks: vscodium.yml
  when: ansible_distribution == "Debian"


#
#  Default profile
#
- name: Add VSCodium extensions
  include_role:
    name: add_vscode_extensions
  vars:
    path_exec: /opt/vscodium/vscodium.AppImage
    path_exec_args: >-
      --user-data-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/default/data
      --extensions-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/default/extensions

    extensions_regular:
      - rogalmic.bash-debug
      - samuelcolvin.jinjahtml
      - wholroyd.jinja
      - yeshan333.jenkins-pipeline-linter-connector-fork
      - pkief.material-icon-theme

      - ms-python.pylint
      - ms-python.python
      - franneck94.vscode-python-config
      - ms-python.debugpy
      - ms-python.vscode-python-envs

      - njqdev.vscode-python-typehint
      - timonwong.shellcheck
      - yy0931.vscode-sqlite3-editor
      - redhat.vscode-yaml

    extensions_vsix:
      - publisher: mariogarrido
        name: gpg-sign
        version: 0.2.0


- name: Create VSCodium shortcut
  include_role:
    name: create_shortcut
  vars:
    filename: vscodium.desktop
    appname: Codium
    generic_name: Text Editor
    startup_class: VSCodium
    comment: Code Editing
    icon: vscodium
    exec: >-
      /opt/vscodium/vscodium.AppImage
      --user-data-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/default/data
      --extensions-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/default/extensions
      %F

    categories:
      - TextEditor
      - Development
      - IDE

    mime_types:
      - text/plain
      - inode/directory
      - application/x-codium-workspace

    actions:
      - id: new-empty-window
        name: New Empty Window
        exec: >-
          /opt/vscodium/vscodium.AppImage
          --user-data-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/default/data
          --extensions-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/default/extensions
          --new-window
          %F



#
#  Claude profile
#
- name: Add VSCodium extensions
  include_role:
    name: add_vscode_extensions
  vars:
    path_exec: /opt/vscodium/vscodium.AppImage
    path_exec_args: >-
      --user-data-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/claude/data
      --extensions-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/claude/extensions

    extensions_regular:
      - anthropic.claude-code

    extensions_vsix:
      - publisher: mariogarrido
        name: gpg-sign
        version: 0.2.0


- name: Create VSCodium Claude shortcut
  include_role:
    name: create_shortcut
  vars:
    filename: claude.desktop
    appname: Claude
    generic_name: Text Editor
    startup_class: VSCodium
    comment: Code Editing
    icon: vscodium
    exec: >-
      /opt/vscodium/vscodium.AppImage
      --user-data-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/claude/data
      --extensions-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/claude/extensions
      %F

    categories:
      - TextEditor
      - Development
      - IDE

    actions:
      - id: new-empty-window
        name: New Empty Window
        exec: >-
          /opt/vscodium/vscodium.AppImage
          --user-data-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/claude/data
          --extensions-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/claude/extensions
          --new-window
          %F



#
#  Golang profile
#
- name: Add VSCodium Golang extensions
  include_role:
    name: add_vscode_extensions
  vars:
    path_exec: /opt/vscodium/vscodium.AppImage
    path_exec_args: >-
      --user-data-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/golang/data
      --extensions-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/golang/extensions

    extensions_regular:
      - golang.go
      - redhat.vscode-yaml

    extensions_vsix: []


- name: Ensure VSCodium Golang settings directory
  file:
    path: "{{ ansible_env.HOME }}/.config/vscodium/profiles/golang/data/User"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid | default(ansible_user_id) }}"


- name: Configure VSCodium Golang profile
  copy:
    dest: "{{ ansible_env.HOME }}/.config/vscodium/profiles/golang/data/User/settings.json"
    content: |
      {
          "go.toolsGopath": "${workspaceFolder}/.tools/go"
      }
    mode: "0600"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid | default(ansible_user_id) }}"


- name: Create VSCodium Golang shortcut
  include_role:
    name: create_shortcut
  vars:
    filename: golang.desktop
    appname: Golang
    generic_name: Text Editor
    startup_class: VSCodium
    comment: Code Editing
    icon: vscodium
    exec: >-
      /opt/vscodium/vscodium.AppImage
      --user-data-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/golang/data
      --extensions-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/golang/extensions
      %F

    categories:
      - TextEditor
      - Development
      - IDE

    actions:
      - id: new-empty-window
        name: New Empty Window
        exec: >-
          /opt/vscodium/vscodium.AppImage
          --user-data-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/golang/data
          --extensions-dir {{ ansible_env.HOME }}/.config/vscodium/profiles/golang/extensions
          --new-window
          %F

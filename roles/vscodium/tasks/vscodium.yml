---

- name: Install vscodium
  include_role:
    name: download_to_location
  vars:
    version: "1.121.03429"

    url: "https://github.com/VSCodium/vscodium/releases/download/{{ version }}/VSCodium-{{ version }}.glibc2.30-x86_64.AppImage"
    # url: https://github.com/valicm/VSCode-AppImage/releases/download/1.118.1/VSCode-x86_64.AppImage
    destination: "/opt/vscodium"
    appname: "vscodium.AppImage"

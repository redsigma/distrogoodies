---
- name: Install packages
  become: true
  apt:
    pkg:
      - stow
    state: present


- name: "[TRANSIENT] Remove files that are replaced by stow"
  loop:
    - .bashrc
    - .profile
  file:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    state: absent
  notify: restow dotfiles

- meta: flush_handlers
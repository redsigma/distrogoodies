---
- name: Ensure ~/.local/bin directory exists
  file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory


- name: Install difftastic
  unarchive:
    src: https://github.com/Wilfred/difftastic/releases/download/{{ diffstatic_version }}/difft-x86_64-unknown-linux-gnu.tar.gz
    dest: "{{ ansible_env.HOME }}/.local/bin"
    remote_src: true
    extra_opts:
      - "difft"


- name: Install fblog
  get_url:
    url: "https://github.com/brocode/fblog/releases/download/v4.17.0/fblog"
    dest: "{{ ansible_env.HOME }}/.local/bin/fblog"
    mode: "0755"
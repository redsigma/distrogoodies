- name: Add Microsoft gpg keys
  become: true
  block:
    - name: Ensure keyring folder exist
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: 0755

    - name: Installing dependencies
      apt:
        pkg:
          - python3-debian
          - python3-apt
        state: present
        update_cache: yes

    - name: "[TRANSIENT] Gathering repo key"
      get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft-linux-signing-key.pub
        mode: '0644'

    - name: Creating gpg key
      command:
        cmd: >
          gpg --dearmor
          --output /etc/apt/keyrings/microsoft-linux-signing-key.gpg
          /etc/apt/keyrings/microsoft-linux-signing-key.pub
      args:
        creates: /etc/apt/keyrings/microsoft-linux-signing-key.gpg

    - name: "[TRANSIENT] Cleanup leftover key file"
      file:
        path: /etc/apt/keyrings/microsoft-linux-signing-key.pub
        state: absent

    - name: "Storing gpg key"
      set_fact:
        "{{ output_gpg_key }}":
          path: "/etc/apt/keyrings/microsoft-linux-signing-key.gpg"

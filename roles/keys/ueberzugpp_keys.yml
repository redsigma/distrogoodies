- name: Add Opensuse gpg keys
  become: true
  block:
    - name: Ensure keyring folder exist
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: 0755

    - name: Installing dependencies
      apt:
        pkg:
          - python3-debian
          - python3-apt
        state: present
        update_cache: yes

    - name: "[TRANSIENT] Gathering repo key"
      get_url:
        url: https://download.opensuse.org/repositories/home:justkidding/Debian_13/Release.key
        dest: /etc/apt/keyrings/ueberzugpp-Release.key
        mode: '0644'

    - name: Creating gpg key
      command:
        cmd: >
          gpg --dearmor
          --output /etc/apt/keyrings/ueberzugpp-Release.gpg
          /etc/apt/keyrings/ueberzugpp-Release.key
      args:
        creates: /etc/apt/keyrings/ueberzugpp-Release.gpg

    - name: "[TRANSIENT] Cleanup leftover key file"
      file:
        path: /etc/apt/keyrings/ueberzugpp-Release.key
        state: absent

    - name: "Storing gpg key"
      set_fact:
        "{{ output_gpg_key }}":
          path: "/etc/apt/keyrings/ueberzugpp-Release.gpg"

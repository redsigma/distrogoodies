---
- name: Install Maven
  become: true
  apt:
    update_cache: true
    name:
      - maven
      - ca-certificates
      - curl
      - tar
    state: present


- name: Downloading java jdk
  block:

    - name: Check jdk-21.0.9+10
      stat:
        path: /opt/java/jdks/jdk_21
      register: jdk_21


    - name: Ensure jdk-21.0.9+10 directory
      become: true
      file:
        path: /opt/java/jdks/jdk_21
        state: directory
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"


    - name: Download jdk-21.0.9+10
      get_url:
        url: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.9%2B10/OpenJDK21U-jdk_x64_linux_hotspot_21.0.9_10.tar.gz
        dest: /tmp/java_jdk.tar.gz
        mode: "0644"
        force: true
      when: not jdk_21.stat.exists


    - name: Extract jdk-21.0.9+10
      unarchive:
        src: /tmp/java_jdk.tar.gz
        dest: /opt/java/jdks/jdk_21
        remote_src: true
        extra_opts:
          - "--strip-components=1"
      when: not jdk_21.stat.exists


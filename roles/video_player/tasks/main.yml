---
- name: Install SMPlayer
  import_tasks: smplayer.yml
  when: ansible_distribution == "Debian"


- name: Configure SMPlayer
  import_tasks: configure.yml
  when: ansible_distribution == "Debian"


- name: Create SMPlayer shortcut
  include_role:
    name: create_shortcut
  vars:
    filename: smplayer.desktop
    appname: SMPlayer
    generic_name: Media Player
    comment: A great MPlayer front-end
    icon: smplayer
    exec: "/opt/smplayer/smplayer.AppImage -pos 40 80 -size 1024 768 %U"
    set_as_default_app: true
    categories:
      - Qt
      - AudioVideo
      - Player
      - Video
    mime_types:
      - audio/ac3
      - audio/mp4
      - audio/mpeg
      - audio/vnd.rn-realaudio
      - audio/vorbis
      - audio/x-adpcm
      - audio/x-matroska
      - audio/x-mp2
      - audio/x-mp3
      - audio/x-ms-wma
      - audio/x-vorbis
      - audio/x-wav
      - audio/mpegurl
      - audio/x-mpegurl
      - audio/x-pn-realaudio
      - audio/x-scpls
      - audio/aac
      - audio/flac
      - audio/ogg
      - video/avi
      - video/mp4
      - video/flv
      - video/mpeg
      - video/quicktime
      - video/vnd.rn-realvideo
      - video/x-matroska
      - video/x-ms-asf
      - video/x-msvideo
      - video/x-ms-wmv
      - video/x-ogm+ogg
      - video/x-theora
      - video/webm

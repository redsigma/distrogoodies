{% set printed_level_overrides = [
  "record.error_severity",
] %}


{% set level_msg_part -%}
{% for key in printed_level_overrides %}
{% raw %}{{#if {% endraw %}{{ key }}{% raw %}}}{{level_style (uppercase (fixed_size 5 {% endraw %}{{ key }}{% raw %}))}}{{else}}{% endraw %}
{% endfor %}
{% raw %}{{level_style (uppercase (fixed_size 5 fblog_level))}}{% endraw %}
{% for _ in printed_level_overrides %}
{% raw %}{{/if}}{% endraw %}
{% endfor %}
{%- endset %}

main_line_format = "{% raw %}{{bold(fixed_size 19 fblog_timestamp)}} {% endraw %}{{ level_msg_part | trim }}{% raw %}:{{#if fblog_prefix}} {{bold(cyan fblog_prefix)}}{{/if}} {{fblog_message}}{% endraw %}"

{% raw %}
message_keys = ["short_message", "msg", "message"]
time_keys = ["timestamp", "time", "@timestamp", "ts"]
dump_all_exclude = []
always_print_fields = ["record", "stacktrace", "stackTrace", "error"]
level_keys = ["record.error_severity", "level", "severity", "log.level", "loglevel"]
additional_value_format = "{{bold (color_rgb 150 150 150 (min_size 25 key))}}: {{value}}"

[level_map]
10 = "trace"
20 = "debug"
30 = "info"
31 = "log"
40 = "warn"
50 = "error"
60 = "fatal"

{% endraw %}
---

#
# NOTES:
#
#  Some tasks have a [PREFIX] before the name. Below they are explained:
#
#  - [TRANSIENT] -> this is an intermediate temporary task. It shouldn't be destructive because a future task will overwrite its changes. It is normal if this step always changes in the playbook
#
#

- name: Bootstrap local machine environment
  handlers:
    - import_tasks: handlers/refresh_dropmenu.yml

  hosts: localhost
  tasks:

    - name: Install core [apps]
      tags: core
      import_role:
        name: core


    - name: Install core [display]
      tags: core_display
      import_role:
        name: core_display


    - name: Install core [input]
      tags: core_input
      import_role:
        name: core_input


    - name: Install toolchains
      tags: toolchain
      import_role:
        name: toolchain


    - name: Install gpg keys
      tags: gpg
      import_role:
        name: gpg


    - name: Install fonts
      tags: fonts
      import_role:
        name: fonts


    - name: Install web browsers
      tags: browser
      import_role:
        name: browser


    - name: Install text editors
      tags: editor
      import_role:
        name: editor


    - name: Install Neovim
      tags: nvim
      import_role:
        name: nvim


    - name: Install Deskflow
      tags: deskflow
      import_role:
        name: deskflow

    #
    # @optional apps
    #

    - name: Install VSCodium
      tags: vscodium
      import_role:
        name: vscodium


    - name: Install Sourcegit
      tags: sourcegit
      import_role:
        name: sourcegit


    - name: Install Nomacs
      tags: image_viewer
      import_role:
        name: image_viewer

    - name: Install OBS
      tags: obs
      import_role:
        name: obs


    - name: Install Mail Client
      tags: mail
      import_role:
        name: mail


    - name: Install Azure VPN Client
      tags: azure_vpn
      import_role:
        name: azure_vpn


    - name: Install Docker
      tags: docker
      import_role:
        name: docker

    - name: Install Skopeo
      tags: skopeo
      import_role:
        name: skopeo

    - name: Install Hashicorp Vault
      tags: hashicorp_vault
      import_role:
        name: secret-manager


    - name: Install Helm Charts
      tags: helm
      import_role:
        name: helm


    - name: Install Golang
      tags: golang
      import_role:
        name: golang


    - name: Install Maven
      tags: maven
      import_role:
        name: maven

    # - name: Install Postman
    #   tags: postman
    #   import_role:
    #     name: postman

    # - name: Install Bruno
    #   tags: bruno
    #   import_role:
    #     name: bruno

    - name: Install QOwnNotes
      tags: qownnotes
      import_role:
        name: qownnotes

    - name: Install KeePassXC
      tags: keepass
      import_role:
        name: keepass

    # - name: Install Rider
    #   tags: rider
    #   import_role:
    #     name: rider

    - name: Install Video Player
      tags: video_player
      import_role:
        name: video_player

    #
    # @optional scripts
    #

    - name: Install Openshift scripts
      tags: openshift
      import_role:
        name: openshift

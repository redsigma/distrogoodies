---
# vscode binary
path_exec: /usr/bin/code

# where downloaded VSIX files are cached.
download_dir: /tmp/vsix

# Normal extension IDs
extensions_regular: []

# Marketplace VSIX extensions.
extensions_vsix: []

file_owner: "{{ ansible_user_id }}"
file_group: "{{ ansible_user_gid | default(ansible_user_id) }}"